
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#087b43">
<title>Wood League Soccer 27 V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif;text-align:center}
header{background:#087b43;padding:14px 5px;font-size:22px;font-weight:bold}
.sub{font-size:12px;margin-top:5px}
.panel{display:flex;justify-content:space-around;align-items:center;padding:10px;font-size:20px;font-weight:bold}
#clock{font-size:16px}
canvas{display:block;width:100%;max-width:700px;height:auto;margin:auto;background:#168c46;touch-action:none}
#message{padding:10px;min-height:40px;font-size:14px}
.controls{display:grid;grid-template-columns:repeat(3, minmax(65px,90px));gap:9px;justify-content:center;padding:10px}
button{border:0;border-radius:12px;background:#087bda;color:white;font-size:17px;font-weight:bold;padding:14px 6px;touch-action:manipulation}
button:active{opacity:.75}
.action{background:#e66b14}
.empty{visibility:hidden}
footer{padding:10px;font-size:11px;color:#ccc}
</style>
</head>
<body>
<header>⚽ WOOD LEAGUE SOCCER 27<div class="sub">VERSION 2 • MINI MATCH</div></header>

<div class="panel">
<span>🔵 <span id="blue">0</span></span>
<span id="clock">⏱ 60 s</span>
<span><span id="red">0</span> 🔴</span>
</div>

<canvas id="game" width="600" height="360"></canvas>
<div id="message">Déplace le joueur bleu, approche-toi du ballon et tire !</div>

<div class="controls">
<button class="empty"> </button>
<button onclick="move(0,-1)">⬆️</button>
<button class="empty"> </button>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(0,1)">⬇️</button>
<button onclick="move(1,0)">➡️</button>
<button class="action" onclick="kick()">TIR ⚽</button>
<button class="action" onclick="passBall()">PASSE</button>
<button onclick="reset()">🔄 REJOUER</button>
</div>
<footer>Wood League Soccer 27 • V2</footer>

<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');
let p={x:135,y:180};
let e={x:465,y:180};
let b={x:300,y:180,vx:0,vy:0};
let blue=0,red=0,seconds=60,playing=true,last=0;

const msg=document.getElementById('message');

function player(x,y,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.arc(x,y,15,0,Math.PI*2);
 ctx.fill();
 ctx.strokeStyle='white';
 ctx.lineWidth=2;
 ctx.stroke();
 ctx.fillStyle='white';
 ctx.beginPath();
 ctx.arc(x,y-4,4,0,Math.PI*2);
 ctx.fill();
}

function draw(){
 ctx.clearRect(0,0,600,360);
 ctx.fillStyle='#168c46';
 ctx.fillRect(0,0,600,360);

 for(let i=0;i<10;i++){
  ctx.fillStyle=i%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.04)';
  ctx.fillRect(i*60,0,60,360);
 }

 ctx.strokeStyle='white';
 ctx.lineWidth=3;
 ctx.strokeRect(10,10,580,340);

 ctx.beginPath();
 ctx.moveTo(300,10);
 ctx.lineTo(300,350);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(300,180,52,0,Math.PI*2);
 ctx.stroke();

 ctx.strokeRect(10,100,75,160);
 ctx.strokeRect(515,100,75,160);
 ctx.strokeRect(10,135,28,90);
 ctx.strokeRect(562,135,28,90);

 player(p.x,p.y,'#167dff');
 player(e.x,e.y,'#ff3434');

 ctx.fillStyle='white';
 ctx.beginPath();
 ctx.arc(b.x,b.y,9,0,Math.PI*2);
 ctx.fill();
 ctx.strokeStyle='#222';
 ctx.lineWidth=1;
 ctx.stroke();

 document.getElementById('blue').textContent=blue;
 document.getElementById('red').textContent=red;
 document.getElementById('clock').textContent='⏱ '+seconds+' s';
}

function move(dx,dy){
 if(!playing)return;

 p.x=Math.max(25,Math.min(575,p.x+dx*19));
 p.y=Math.max(25,Math.min(335,p.y+dy*19));

 if(Math.hypot(p.x-b.x,p.y-b.y)<42){
  b.vx=dx*3.2;
  b.vy=dy*3.2;
 }
 draw();
}

function kick(){
 if(!playing)return;

 if(Math.hypot(p.x-b.x,p.y-b.y)<66){
  let dx=b.x-p.x;
  let dy=b.y-p.y;
  let d=Math.hypot(dx,dy)||1;
  b.vx=dx/d*10;
  b.vy=dy/d*7;
  msg.textContent='TIR ! Vise le but rouge !';
 }else{
  msg.textContent='Approche-toi du ballon pour tirer.';
 }
}

function passBall(){
 if(!playing)return;

 if(Math.hypot(p.x-b.x,p.y-b.y)<70){
  b.vx=7;
  b.vy=(180-b.y)*.035;
  msg.textContent='Bonne passe !';
 }else{
  msg.textContent='Rapproche-toi du ballon pour passer.';
 }
}

function reset(){
 p={x:135,y:180};
 e={x:465,y:180};
 b={x:300,y:180,vx:0,vy:0};
 blue=0;
 red=0;
 seconds=60;
 playing=true;
 last=0;
 msg.textContent='Nouveau match ! À toi de jouer.';
 draw();
}

function tick(t){
 if(!last)last=t;

 if(playing && t-last>=1000){
  seconds--;
  last=t;

  if(seconds<=0){
   seconds=0;
   playing=false;

   if(blue>red)msg.textContent='🏆 Victoire ! Tu as gagné !';
   else if(blue===red)msg.textContent='🤝 Match nul !';
   else msg.textContent='Match terminé. Réessaie !';
  }
 }

 if(playing){
  b.x+=b.vx;
  b.y+=b.vy;
  b.vx*=.985;
  b.vy*=.985;

  if(b.y<20||b.y>340){
   b.y=Math.max(20,Math.min(340,b.y));
   b.vy*=-.8;
  }

  if(b.x<8){
   red++;
   b.x=300;b.y=180;b.vx=0;b.vy=0;
   msg.textContent='But rouge ! Continue !';
  }

  if(b.x>592){
   blue++;
   b.x=300;b.y=180;b.vx=0;b.vy=0;
   msg.textContent='⚽ BUT ! Bien joué !';
  }

  let dx=b.x-e.x;
  let dy=b.y-e.y;
  let d=Math.hypot(dx,dy)||1;
  e.x+=dx/d*.8;
  e.y+=dy/d*.8;

  if(d<24){
   b.vx=-3.2;
   b.vy=(b.y-e.y)*.25;
  }
 }

 draw();
 requestAnimationFrame(tick);
}

draw();
requestAnimationFrame(tick);
</script>
</body>
</html>
