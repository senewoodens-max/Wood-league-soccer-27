
<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">

<meta charset="UTF-8">

<title>Wood League Soccer 27 V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#061629;color:white;font-family:Arial,sans-serif;overflow:hidden}
button{border:0;border-radius:10px;padding:13px;font-weight:bold;font-size:16px;cursor:pointer;touch-action:manipulation}
#menu{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle,#15517b,#061629 70%)}
.card{width:100%;max-width:520px;text-align:center;background:#071b30;border:1px solid #367bb0;border-radius:20px;padding:24px;box-shadow:0 10px 40px #0008}
h1{font-size:clamp(30px,8vw,52px);font-style:italic;margin:5px 0}
.gold{color:#ffd21f}
.sub{color:#a8cce8}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}
.team{background:#123554;color:white;border:1px solid #387bb0}
.team.selected{background:#ffd21f;color:#061629}
<button class="team selected" data-team="Woodens FC">🟡 Woodens FC</button>
<button class="team" data-team="Real Madrid">⚪ Real Madrid</button>
<button class="team" data-team="FC Barcelone">🔵 FC Barcelone</button>
<button class="team" data-team="Manchester City">🔷 Man City</button>
<button class="team" data-team="Liverpool">🔴 Liverpool</button>
<button class="team" data-team="PSG">🔵 PSG</button>
<button class="team" data-team="Arsenal">🔴 Arsenal</button>
<button class="team" data-team="Bayern Munich">🔴 Bayern Munich</button>
<button class="team" data-team="Haiti">🇭🇹 Haïti</button>
<button class="team" data-team="Brésil">🇧🇷 Brésil</button>
<button class="team" data-team="Green Stars">🟢 Green Stars</button>
<button class="team" data-team="Red Lions">🔴 Red Lions</button>

#play{width:100%;background:#ffd21f;color:#061629;font-size:22px}
#game{display:none;position:fixed;inset:0;background:#08733b}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#061629eF;border:1px solid #4685b2;border-radius:10px;padding:9px;font-weight:bold;white-space:nowrap}
#score{color:#ffd21f;font-size:20px}
#pause{position:absolute;right:8px;top:8px;background:#061629;color:white}
#stick{position:absolute;bottom:18px;left:18px;width:100px;height:100px;border-radius:50%;border:2px solid #fff9;background:#ffffff30;touch-action:none}
#knob{position:absolute;left:27px;top:27px;width:42px;height:42px;border-radius:50%;background:#fffC;border:2px solid white}
#actions{position:absolute;right:12px;bottom:20px;display:flex;gap:8px;align-items:end}
#actions button{width:64px;height:64px;border-radius:50%;background:#082642;color:white;border:2px solid white;font-size:12px;padding:4px}
#actions #shoot{width:76px;height:76px;background:#ffd21f;color:#061629}
#back{position:absolute;left:8px;top:8px;background:#061629;color:white;display:none}
@media(orientation:portrait) and (max-width:700px){
 #hud{top:7px;gap:7px;padding:7px;font-size:12px}
 #stick{width:85px;height:85px;bottom:14px;left:10px}
 #knob{left:22px;top:22px;width:38px;height:38px}
 #actions{right:8px;bottom:14px;gap:5px}
 #actions button{width:53px;height:53px}
 #actions #shoot{width:65px;height:65px}
}
</style>
</head>
<body>

<section id="menu">
 <div class="card">
  <h1>WOOD LEAGUE<br>SOCCER <span class="gold">27</span></h1>
  <h2 class="gold">VERSION 3</h2>
  <p class="sub">Joue. Progresse. Deviens une légende !</p>
  <h3>CHOISIS TON ÉQUIPE</h3>
  <div class="teams">
   <button class="team selected" data-team="Woodens FC">🟡 Woodens FC</button>
   <button class="team" data-team="Green Stars">🟢 Green Stars</button>
   <button class="team" data-team="Red Lions">🔴 Red Lions</button>
   <button class="team" data-team="Golden FC">🔵 Golden FC</button>
  </div>
<button class="team selected" data-team="Woodens FC">🟡 Woodens FC</button>
<button class="team" data-team="Real Madrid">⚪ Real Madrid</button>
<button class="team" data-team="FC Barcelone">🔵 FC Barcelone</button>
<button class="team" data-team="Manchester City">🔷 Man City</button>
<button class="team" data-team="Liverpool">🔴 Liverpool</button>
<button class="team" data-team="PSG">🔵 PSG</button>
<button class="team" data-team="Arsenal">🔴 Arsenal</button>
<button class="team" data-team="Bayern Munich">🔴 Bayern Munich</button>
<button class="team" data-team="Haiti">🇭🇹 Haïti</button>
<button class="team" data-team="Brésil">🇧🇷 Brésil</button>
<button class="team" data-team="Green Stars">🟢 Green Stars</button>
<button class="team" data-team="Red Lions">🔴 Red Lions</button>

<button class="team selected" data-team="Woodens FC">🟡 Woodens FC</button>
<button class="team" data-team="Real Madrid">⚪ Real Madrid</button>
<button class="team" data-team="FC Barcelone">🔵 FC Barcelone</button>
<button class="team" data-team="Manchester City">🔷 Man City</button>
<button class="team" data-team="Liverpool">🔴 Liverpool</button>
<button class="team" data-team="PSG">🔵 PSG</button>
<button class="team" data-team="Arsenal">🔴 Arsenal</button>
<button class="team" data-team="Bayern Munich">🔴 Bayern Munich</button>
<button class="team" data-team="Haiti">🇭🇹 Haïti</button>
<button class="team" data-team="Brésil">🇧🇷 Brésil</button>
<button class="team" data-team="Green Stars">🟢 Green Stars</button>
<button class="team" data-team="Red Lions">🔴 Red Lions</button>

  <button id="play">▶ JOUER</button>
  <p class="sub">Déplace-toi • Fais des passes • Marque des buts</p>
 </div>
</section>

<section id="game">
 <canvas id="pitch"></canvas>
 <div id="hud"><span id="teamname">WOODENS FC</span><span id="score">0 - 0</span><span id="clock">00:00</span></div>
 <button id="pause">Ⅱ</button>
 <button id="back">MENU</button>
 <div id="stick"><div id="knob"></div></div>
 <div id="actions">
  <button id="pass">PASSE</button>
  <button id="shoot">TIR !</button>
 </div>
</section>

<script>
const $=id=>document.getElementById(id);
const canvas=$('pitch'),ctx=canvas.getContext('2d');
let team='Woodens FC'
let team='Woodens FC',mode='match',active=false,paused=false,last=0,seconds=0;
,active=false,paused=false,last=0,seconds=0;
let goals=[0,0],mx=0,my=0,pointer=null;
let W=innerWidth,H=innerHeight,players=[],ball={x:0,y:0,vx:0,vy:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

document.querySelectorAll('.team').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.team').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');team=btn.dataset.team;
 };
});

function resize(){
 W=innerWidth;H=innerHeight;
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);

function reset(){
 players=[];
 for(let i=0;i<5;i++){
  players.push({x:W*.2+(i%2)*W*.06,y:H*(.2+i*.14),side:0,n:i,phase:i});
  players.push({x:W*.8-(i%2)*W*.06,y:H*(.2+i*.14),side:1,n:i,phase:i+2});
 }
 players[0].x=W*.4;players[0].y=H*.5;
 ball={x:W*.5,y:H*.5,vx:0,vy:0};
}
function start(){
 $('menu').style.display='none';
 $('game').style.display='block';
 $('teamname').textContent=team.toUpperCase();
 active=true;paused=false;seconds=0;goals=[0,0];
 $('score').textContent='0 - 0';
 $('pause').textContent='Ⅱ';
 resize();reset();last=performance.now();
 requestAnimationFrame(loop);
 try{
  if(document.documentElement.requestFullscreen){
   document.documentElement.requestFullscreen().then(()=>{
    if(screen.orientation&&screen.orientation.lock)
     screen.orientation.lock('landscape').catch(()=>{});
   }).catch(()=>{});
  }
 }catch(e){}
}
$('play').addEventListener('click',start);
$('pause').onclick=()=>{
 paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';
 if(!paused){last=performance.now();requestAnimationFrame(loop);}
};
$('back').onclick=()=>{
 active=false;$('game').style.display='none';$('menu').style.display='flex';
 try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
};

function pitch(){
 ctx.fillStyle='#08783a';ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){
  ctx.fillStyle=i%2?'#08783a':'#0a8040';
  ctx.fillRect(i*W/10,0,W/10,H);
 }
 ctx.strokeStyle='#eaffef';ctx.lineWidth=2;
 ctx.strokeRect(W*.035,H*.06,W*.93,H*.88);
 ctx.beginPath();ctx.moveTo(W/2,H*.06);ctx.lineTo(W/2,H*.94);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,H/2,H*.14,0,Math.PI*2);ctx.stroke();
 ctx.strokeRect(W*.035,H*.29,W*.15,H*.42);
 ctx.strokeRect(W*.815,H*.29,W*.15,H*.42);
 ctx.strokeRect(W*.035,H*.39,W*.06,H*.22);
 ctx.strokeRect(W*.905,H*.39,W*.06,H*.22);
 ctx.fillStyle='white';
 ctx.fillRect(0,H*.40,W*.035,H*.20);
 ctx.fillRect(W*.965,H*.40,W*.035,H*.20);
}

function drawPlayer(p,t){
 const s=clamp(Math.min(W,H)*.028,9,17);
 const moving=Math.abs(p.vx||0)+Math.abs(p.vy||0)>.3;
 const bob=moving?Math.sin(t*.015+p.phase)*2:0;
 ctx.fillStyle='#001b0b66';
 ctx.beginPath();ctx.ellipse(p.x,p.y+s*.55,s*.65,s*.28,0,0,7);ctx.fill();
 const stride=moving?Math.sin(t*.02+p.phase)*s*.22:0;
 ctx.lineCap='round';ctx.lineWidth=s*.22;ctx.strokeStyle='#172333';
 ctx.beginPath();
 ctx.moveTo(p.x-s*.15,p.y+s*.1+bob);ctx.lineTo(p.x-s*.2+stride,p.y+s*.65);
 ctx.moveTo(p.x+s*.15,p.y+s*.1+bob);ctx.lineTo(p.x+s*.2-stride,p.y+s*.65);
 ctx.stroke();
 ctx.fillStyle=p.side===0?'#f2c51b':'#db2948';
 ctx.beginPath();ctx.roundRect(p.x-s*.31,p.y-s*.32+bob,s*.62,s*.52,s*.1);ctx.fill();
 ctx.fillStyle='#173c79';ctx.fillRect(p.x-s*.25,p.y+s*.16,s*.5,s*.15);
 ctx.fillStyle='#bd8059';ctx.beginPath();ctx.arc(p.x,p.y-s*.45+bob,s*.22,0,7);ctx.fill();
 ctx.fillStyle='#28201d';ctx.beginPath();ctx.arc(p.x,p.y-s*.5+bob,s*.22,Math.PI,Math.PI*2);ctx.fill();
 if(p===players[0]){
  ctx.strokeStyle='#fff6a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,s*.8,0,7);ctx.stroke();
 }
}
function drawBall(){
 ctx.fillStyle='#00150077';ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+5,8,4,0,0,7);ctx.fill();
 ctx.fillStyle='white';ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,7);ctx.fill();
 ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.stroke();
}
function loop(now){
 if(!active||paused)return;
 const dt=Math.min((now-last)/16.67,2);last=now;seconds+=dt/60;
 $('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(Math.floor(seconds%60)).padStart(2,'0');

 const p=players[0],speed=Math.min(W,H)*.005;
 p.vx=mx*speed;p.vy=my*speed;
 p.x=clamp(p.x+p.vx*dt,W*.05,W*.95);
 p.y=clamp(p.y+p.vy*dt,H*.08,H*.92);

 players.forEach((q,i)=>{
  if(i===0)return;
  const tx=q.side===0?W*.35:W*.65;
  const ty=H*(.18+(q.n%5)*.16);
  q.vx=(tx-q.x)*.01;q.vy=(ty-q.y)*.01;
  q.x=clamp(q.x+q.vx*dt,W*.05,W*.95);
  q.y=clamp(q.y+q.vy*dt,H*.08,H*.92);
 });
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 ball.vx*=Math.pow(.985,dt);ball.vy*=Math.pow(.985,dt);
 if(ball.y<H*.07||ball.y>H*.93)ball.vy*=-.8;
 if(ball.x<W*.035||ball.x>W*.965){
  if(ball.y>H*.39&&ball.y<H*.61){
   if(ball.x<W*.035)goals[1]++;else goals[0]++;
   $('score').textContent=goals[0]+' - '+goals[1];reset();
  }else ball.vx*=-.8;
 }
 pitch();players.forEach(q=>drawPlayer(q,now));drawBall();
 requestAnimationFrame(loop);
}

function kick(power,angle){
 const p=players[0];if(!p)return;
 const dx=ball.x-p.x,dy=ball.y-p.y;
 let a=angle;
 if(a===undefined)a=Math.atan2(dy,dx);
 if(Math.hypot(dx,dy)>Math.min(W,H)*.2)a=0;
 ball.x=p.x+Math.cos(a)*18;ball.y=p.y+Math.sin(a)*18;
 ball.vx=Math.cos(a)*power;ball.vy=Math.sin(a)*power;
}
$('shoot').onclick=()=>kick(Math.min(W,H)*.045,0);
$('pass').onclick=()=>kick(Math.min(W,H)*.022,undefined);

const stick=$('stick'),knob=$('knob');
function moveStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=r.width*.32,len=Math.hypot(dx,dy)||1;
 dx*=Math.min(1,max/len);dy*=Math.min(1,max/len);
 mx=dx/max;my=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
}
stick.addEventListener('pointerdown',e=>{
 pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);
});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)moveStick(e);});
function release(){pointer=null;mx=0;my=0;knob.style.transform='translate(0,0)';}
stick.addEventListener('pointerup',release);
stick.addEventListener('pointercancel',release);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')mx=-1;
 if(e.key==='ArrowRight'||e.key==='d')mx=1;
 if(e.key==='ArrowUp'||e.key==='w')my=-1;
 if(e.key==='ArrowDown'||e.key==='s')my=1;
 if(e.key===' ')kick(Math.min(W,H)*.045,0);
});
document.addEventListener('keyup',e=>{
 if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))mx=0;
 if(['ArrowUp','ArrowDown','w','s'].includes(e.key))my=0;
});
</script>
</body>
</html>
