<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wood League Soccer 27</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center}
header{padding:12px;background:#087b43;font-size:22px;font-weight:bold}
#score{font-size:24px;padding:10px}
canvas{width:100%;max-width:600px;display:block;margin:auto;background:#168c46;touch-action:none}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px}
button{padding:14px 18px;border:0;border-radius:10px;background:#087bda;color:white;font-size:18px;font-weight:bold}
#message{padding:8px}
</style>
</head>
<body>
<header>⚽ WOOD LEAGUE SOCCER 27</header>
<div id="score">🔵 0 - 0 🔴</div>
<canvas id="game" width="600" height="360"></canvas>
<div id="message">Déplace ton joueur bleu et marque !</div>
<div class="controls">
<button onclick="move(0,-1)">⬆️</button>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(0,1)">⬇️</button>
<button onclick="move(1,0)">➡️</button>
<button onclick="kick()">TIR ⚽</button>
<button onclick="reset()">REJOUER</button>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let p={x:130,y:180},e={x:470,y:180},b={x:300,y:180,vx:0,vy:0};
let blue=0,red=0;
function draw(){
 ctx.clearRect(0,0,600,360);
 ctx.fillStyle='#168c46';ctx.fillRect(0,0,600,360);
 ctx.strokeStyle='white';ctx.lineWidth=3;
 ctx.strokeRect(10,10,580,340);
 ctx.beginPath();ctx.moveTo(300,10);ctx.lineTo(300,350);ctx.stroke();
 ctx.beginPath();ctx.arc(300,180,55,0,Math.PI*2);ctx.stroke();
 ctx.strokeRect(10,100,75,160);ctx.strokeRect(515,100,75,160);
 ctx.fillStyle='white';ctx.fillRect(0,140,12,80);ctx.fillRect(588,140,12,80);
 player(p.x,p.y,'#167dff');player(e.x,e.y,'#ff3434');
 ctx.fillStyle='white';ctx.beginPath();ctx.arc(b.x,b.y,9,0,Math.PI*2);ctx.fill();
 document.getElementById('score').textContent='🔵 '+blue+' - '+red+' 🔴';
}
function player(x,y,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();
}
function move(dx,dy){
 p.x=Math.max(25,Math.min(575,p.x+dx*18));
 p.y=Math.max(25,Math.min(335,p.y+dy*18));
 if(Math.hypot(p.x-b.x,p.y-b.y)<40){b.vx=dx*5;b.vy=dy*5}
 draw();
}
function kick(){
 let d=Math.hypot(b.x-p.x,b.y-p.y);
 if(d<65){b.vx=8;b.vy=(b.y-p.y)*0.15;
 document.getElementById('message').textContent='Tir !';}
 else document.getElementById('message').textContent='Approche-toi du ballon !';
}
function reset(){p={x:130,y:180};e={x:470,y:180};b={x:300,y:180,vx:0,vy:0};blue=0;red=0;draw()}
function loop(){
 b.x+=b.vx;b.y+=b.vy;b.vx*=0.98;b.vy*=0.98;
 if(b.y<20||b.y>340)b.vy*=-1;
 if(b.x<8){red++;b.x=300;b.y=180;b.vx=0;b.vy=0}
 if(b.x>592){blue++;b.x=300;b.y=180;b.vx=0;b.vy=0}
 e.x+=Math.sign(b.x-e.x)*0.7;
 e.y+=Math.sign(b.y-e.y)*0.7;
 if(Math.hypot(e.x-b.x,e.y-b.y)<24){b.vx=-3;b.vy=(b.y-e.y)*0.3}
 draw();requestAnimationFrame(loop);
}
draw();loop();
</script>
</body>
</html>
